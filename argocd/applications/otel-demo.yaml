apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: otel-demo-kind
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-demo
      targetRevision: 0.42.6
      helm:
        releaseName: otel-demo
        valueFiles:
          - $values/applications/otel-demo/values.yaml

    - repoURL: https://github.com/lackito/otel-demo-gitops-kind.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/lackito/otel-demo-gitops-kind.git
      targetRevision: main
      path: applications/otel-demo/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
