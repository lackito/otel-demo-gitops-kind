opentelemetry-collector:
  enabled: true
  mode: deployment
  replicaCount: 1
  config:
    exporters:
      debug:
        verbosity: basic
    service:
      pipelines:
        logs:
          # Store application logs locally and retain basic Collector diagnostics.
          exporters: [opensearch, debug]
  resources:
    limits:
      memory: 300Mi

jaeger:
  enabled: true
  # In-memory trace storage grew to the upstream 400Mi limit under the
  # continuous local load generator. Retain fewer traces and leave measured
  # runtime headroom without changing the AWS environment.
  allInOne:
    args:
      - --memory.max-traces=2000
      - --query.base-path=/jaeger/ui
      - --prometheus.server-url=http://prometheus:9090
      - --prometheus.query.normalize-calls=true
      - --prometheus.query.normalize-duration=true
    resources:
      limits:
        memory: 512Mi

prometheus:
  enabled: true
  server:
    resources:
      limits:
        memory: 512Mi

grafana:
  enabled: true
  sidecar:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
    datasources:
      enabled: false
  resources:
    limits:
      memory: 384Mi

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: webstore-metrics
          type: prometheus
          url: http://prometheus:9090
          editable: true
          isDefault: true
          jsonData:
      # Align Prometheus data source time interval with the OTel SDKs' export interval (see OTEL_METRIC_EXPORT_INTERVAL)
            timeInterval: 60s
            exemplarTraceIdDestinations:
              - datasourceUid: webstore-traces
                name: trace_id

              - url: http://otel-demo.localhost/jaeger/ui/trace/$${__value.raw}
                name: trace_id
                urlDisplayLabel: View in Jaeger UI
        - name: Jaeger
          uid: webstore-traces
          type: jaeger
          url: http://jaeger-query:16686/jaeger/ui
          editable: true
          isDefault: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: webstore-logs
              spanStartTimeShift: -20m
              spanEndTimeShift: 20m
              filterByTraceID: true
              filterBySpanID: true
              customQuery: true
              query: traceId:"$${__trace.traceId}" AND spanId:"$${__span.spanId}"
        - name: OpenSearch
          uid: webstore-logs
          type: grafana-opensearch-datasource
          url: http://opensearch:9200/
          access: proxy
          editable: true
          isDefault: false
          jsonData:
            database: '[otel-logs-]YYYY-MM-DD'
            flavor: opensearch
            logLevelField: severity.text.keyword
            logMessageField: body
            pplEnabled: true
            timeField: observedTimestamp
            version: 3.2.0
            interval: Daily
opensearch:
  enabled: true
  config:
    opensearch.yml: |
      cluster.name: demo-cluster
      network.host: 0.0.0.0
      cluster.default_number_of_replicas: 0
  # Single-node, ephemeral storage and a 400 MiB heap are inherited from the
  # pinned demo chart. Reserve realistic memory while keeping startup CPU free.
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      memory: 1100Mi

components:
  recommendation:
    # Promoted by the Recommendation kind release workflow.
    imageOverride:
      repository: ghcr.io/lackito/otel-demo-kind-recommendation
      tag: a8328de13a141b680810a865913d46ea79358d1a
      pullPolicy: IfNotPresent

  flagd:
    # The optional 2.1.3 flag editor UI grows until OOM on the local arm64
    # environment, both natively and through amd64 emulation. Keep the flagd
    # evaluation service and manage its flag document declaratively instead.
    sidecarContainers: []
  product-catalog:
    imageOverride:
      repository: ghcr.io/lackito/otel-demo-kind-product-catalog
      tag: 7314d1c98b9ff704c47eb7c4162b85c2f16fa228
      pullPolicy: IfNotPresent
  ad:
    imageOverride:
      repository: ghcr.io/lackito/otel-demo-kind-ad
      tag: 7314d1c98b9ff704c47eb7c4162b85c2f16fa228
      pullPolicy: IfNotPresent
  frontend:
    # 65 minutes exceeds Envoy's one-hour upstream idle timeout.
    envOverrides:
      - name: KEEP_ALIVE_TIMEOUT
        value: '3900000'
      - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: http://otel-demo.localhost/otlp-http/v1/traces
  image-provider:
    mountedConfigMaps:
      - name: kind-feature-page
        mountPath: /static/feature-editor-disabled.html
        subPath: feature-editor-disabled.html
        data:
          feature-editor-disabled.html: |
            <!doctype html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Feature flags — local demo</title>
              <style>body { font: 1rem system-ui, sans-serif; max-width: 42rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.6; }</style>
            </head>
            <body>
              <main>
                <h1>Feature flag editor is disabled</h1>
                <p>This local demo manages feature flags through GitOps. Existing feature flags continue to work.</p>
                <p><a href="/">Return to the storefront</a></p>
              </main>
            </body>
            </html>
